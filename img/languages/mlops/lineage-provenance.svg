<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Lineage and provenance</title>
  <desc id="description">A traceable path links a versioned dataset and code to feature generation, a model artifact, evaluation evidence, and a deployment. Each prediction can be traced back through those records.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526477"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:18px;font-weight:700}.body{font-size:16px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f8f6"/>
  <text x="64" y="76" class="title">Know what produced each prediction</text>
  <text x="64" y="111" class="sub">Lineage connects inputs, transformations, artifacts, and the running service.</text>
  <rect x="67" y="222" width="202" height="120" rx="18" fill="#dcedf6" stroke="#246d91" stroke-width="2"/>
  <text x="101" y="267" class="head">DATASET</text><text x="97" y="297" class="body">snapshot + source</text><text x="115" y="324" class="body">version</text>
  <rect x="344" y="222" width="202" height="120" rx="18" fill="#e5e0f6" stroke="#7161a8" stroke-width="2"/>
  <text x="383" y="267" class="head">CODE + CONFIG</text><text x="374" y="297" class="body">commit + parameters</text><text x="405" y="324" class="body">environment</text>
  <rect x="621" y="222" width="202" height="120" rx="18" fill="#d9f3e7" stroke="#23835b" stroke-width="2"/>
  <text x="653" y="267" class="head">FEATURES</text><text x="654" y="297" class="body">transform version</text><text x="666" y="324" class="body">+ schema</text>
  <rect x="898" y="222" width="236" height="120" rx="18" fill="#fff0c7" stroke="#bb8212" stroke-width="2"/>
  <text x="937" y="267" class="head">MODEL ARTIFACT</text><text x="939" y="297" class="body">weights + metadata</text><text x="952" y="324" class="body">+ evaluation</text>
  <path d="M269 282H336M546 282H613M823 282H890" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1016 342V421" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="761" y="432" width="373" height="96" rx="18" fill="#e8eef5" stroke="#526477" stroke-width="2"/>
  <text x="812" y="471" class="head">DEPLOYMENT RECORD</text><text x="803" y="501" class="body">service version + approval + date</text>
  <path d="M761 481H651" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="284" y="432" width="357" height="96" rx="18" fill="#fce2df" stroke="#c35a43" stroke-width="2"/>
  <text x="336" y="471" class="head">PREDICTION TRACE</text><text x="323" y="501" class="body">request links to exact deployed version</text>
  <path d="M462 342V423" fill="none" stroke="#c35a43" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="67" y="575" width="1067" height="73" rx="16" fill="#e8eef5"/>
  <text x="98" y="607" class="head">Why it matters</text><text x="98" y="634" class="body">Reproduce results · investigate incidents · audit changes · honor retention and deletion rules.</text>
</svg>
