<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Machine-learning lifecycle</title>
  <desc id="description">Problem framing flows through data, training, evaluation, registry, deployment, and monitoring. Monitoring feedback informs later data and training cycles.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526477"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:18px;font-weight:700}.body{font-size:16px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f8f6"/>
  <text x="64" y="76" class="title">A model is one stage in the lifecycle</text>
  <text x="64" y="111" class="sub">Every release needs evidence, ownership, monitoring, and a way back.</text>
  <g>
    <rect x="60" y="231" width="148" height="100" rx="17" fill="#e5e0f6"/><text x="85" y="271" class="head">FRAME</text><text x="81" y="300" class="body">goal + metric</text>
    <rect x="238" y="231" width="148" height="100" rx="17" fill="#dcedf6"/><text x="275" y="271" class="head">DATA</text><text x="253" y="300" class="body">validate + version</text>
    <rect x="416" y="231" width="148" height="100" rx="17" fill="#d9f3e7"/><text x="453" y="271" class="head">TRAIN</text><text x="440" y="300" class="body">track experiment</text>
    <rect x="594" y="231" width="148" height="100" rx="17" fill="#fff0c7"/><text x="629" y="271" class="head">EVALUATE</text><text x="616" y="300" class="body">gate candidate</text>
    <rect x="772" y="231" width="148" height="100" rx="17" fill="#e6e1fa"/><text x="800" y="271" class="head">REGISTER</text><text x="796" y="300" class="body">approve version</text>
    <rect x="950" y="231" width="148" height="100" rx="17" fill="#dcedf6"/><text x="990" y="271" class="head">DEPLOY</text><text x="970" y="300" class="body">canary + rollback</text>
    <path d="M208 281H230M386 281H408M564 281H586M742 281H764M920 281H942" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <rect x="808" y="422" width="290" height="94" rx="18" fill="#d9f3e7" stroke="#23835b" stroke-width="2"/>
  <text x="861" y="460" class="head">MONITOR</text><text x="838" y="491" class="body">service + delayed outcomes</text>
  <path d="M1024 331V414" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M808 468H484V340" fill="none" stroke="#23835b" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
  <text x="525" y="455" class="body" fill="#236e52">evidence informs the next data/training cycle</text>
  <rect x="60" y="575" width="1038" height="73" rx="16" fill="#e8eef5"/>
  <text x="90" y="607" class="head">Release discipline</text><text x="90" y="634" class="body">Version inputs and artifacts · record approvals · watch guardrails · rehearse rollback.</text>
</svg>
