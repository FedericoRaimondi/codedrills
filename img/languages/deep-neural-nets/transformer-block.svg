<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">A transformer block</title>
  <desc id="description">Token representations enter masked self-attention, pass through a residual connection and normalization, then a feed-forward layer with another residual path and normalization.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#536679"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:20px;font-weight:700}.body{font-size:17px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f8fa"/>
  <text x="64" y="76" class="title">Inside a transformer block</text>
  <text x="64" y="111" class="sub">Attention mixes context; residual paths carry the original signal forward.</text>
  <rect x="80" y="180" width="170" height="78" rx="16" fill="#dcedf6" stroke="#246d91" stroke-width="2"/>
  <text x="110" y="214" class="head">Token vectors</text><text x="120" y="241" class="body">+ position</text>
  <path d="M250 219H330" stroke="#536679" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="338" y="180" width="250" height="78" rx="16" fill="#e6e1fa" stroke="#7161a8" stroke-width="2"/>
  <text x="375" y="214" class="head">Masked self-attention</text><text x="385" y="241" class="body">queries · keys · values</text>
  <path d="M588 219H670" stroke="#536679" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="678" y="180" width="180" height="78" rx="16" fill="#d9f3e7" stroke="#23835b" stroke-width="2"/>
  <text x="719" y="214" class="head">Add + norm</text><text x="724" y="241" class="body">residual path</text>
  <path d="M858 219H940" stroke="#536679" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="948" y="180" width="180" height="78" rx="16" fill="#fff0c7" stroke="#bb8212" stroke-width="2"/>
  <text x="975" y="214" class="head">Feed-forward</text><text x="986" y="241" class="body">per token</text>
  <path d="M1038 258V334H770V266" fill="none" stroke="#8e7cbd" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="866" y="325" class="body" fill="#66588d">second residual path</text>
  <path d="M1038 258V393H1060V430" fill="none" stroke="#536679" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="820" y="438" width="308" height="92" rx="18" fill="#dcedf6" stroke="#246d91" stroke-width="2"/>
  <text x="864" y="477" class="head">Output representations</text><text x="864" y="506" class="body">ready for the next block</text>
  <rect x="80" y="378" width="620" height="165" rx="18" fill="#edf1f6"/>
  <text x="112" y="416" class="head">Causal mask</text>
  <text x="112" y="448" class="body">A token can use earlier context,</text><text x="112" y="476" class="body">not future tokens.</text>
  <g transform="translate(420 406)">
    <rect width="35" height="35" fill="#69a7c7"/><rect x="40" width="35" height="35" fill="#b9c9d4"/><rect x="80" width="35" height="35" fill="#b9c9d4"/>
    <rect y="40" width="35" height="35" fill="#69a7c7"/><rect x="40" y="40" width="35" height="35" fill="#69a7c7"/><rect x="80" y="40" width="35" height="35" fill="#b9c9d4"/>
    <rect y="80" width="35" height="35" fill="#69a7c7"/><rect x="40" y="80" width="35" height="35" fill="#69a7c7"/><rect x="80" y="80" width="35" height="35" fill="#69a7c7"/>
  </g>
  <text x="80" y="604" class="body" fill="#526477">Block variants differ in ordering and normalization; masks define which context is visible.</text>
</svg>
