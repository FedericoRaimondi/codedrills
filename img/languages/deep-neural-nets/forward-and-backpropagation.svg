<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Forward pass and backpropagation</title>
  <desc id="description">Inputs flow forward through hidden layers to a prediction and loss. Gradients flow backward from the loss through the layers to update weights.</desc>
  <defs>
    <marker id="forward" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#246d91"/></marker>
    <marker id="backward" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c35a43"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:19px;font-weight:700}.body{font-size:16px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f8fa"/>
  <text x="64" y="76" class="title">Two directions, one learning step</text>
  <text x="64" y="111" class="sub">Predictions move forward; error information moves backward.</text>
  <text x="68" y="191" class="head" fill="#246d91">FORWARD PASS</text>
  <rect x="65" y="228" width="160" height="118" rx="18" fill="#dcedf6" stroke="#246d91" stroke-width="2"/>
  <rect x="285" y="228" width="190" height="118" rx="18" fill="#e6e1fa" stroke="#7161a8" stroke-width="2"/>
  <rect x="535" y="228" width="190" height="118" rx="18" fill="#e6e1fa" stroke="#7161a8" stroke-width="2"/>
  <rect x="785" y="228" width="160" height="118" rx="18" fill="#d9f3e7" stroke="#23835b" stroke-width="2"/>
  <rect x="1005" y="228" width="130" height="118" rx="18" fill="#fff0c7" stroke="#bb8212" stroke-width="2"/>
  <text x="107" y="275" class="head">INPUT</text><text x="103" y="308" class="body">features x</text>
  <text x="321" y="275" class="head">LAYER 1</text><text x="327" y="308" class="body">weights + ReLU</text>
  <text x="571" y="275" class="head">LAYER 2</text><text x="579" y="308" class="body">weights + ReLU</text>
  <text x="819" y="275" class="head">PREDICT</text><text x="831" y="308" class="body">ŷ</text>
  <text x="1045" y="275" class="head">LOSS</text><text x="1040" y="308" class="body">L(ŷ, y)</text>
  <path d="M225 286H278M475 286H528M725 286H778M945 286H998" fill="none" stroke="#246d91" stroke-width="4" marker-end="url(#forward)"/>
  <text x="68" y="412" class="head" fill="#c35a43">BACKPROPAGATION</text>
  <path d="M1065 432H868V495H628V432H378V495H155V432" fill="none" stroke="#c35a43" stroke-width="4" marker-end="url(#backward)"/>
  <text x="934" y="462" class="body" fill="#9b3b2b">compute gradients</text>
  <rect x="65" y="548" width="1070" height="82" rx="18" fill="#e8eef5"/>
  <text x="96" y="582" class="head">Update parameters</text>
  <text x="96" y="611" class="body">The optimizer adjusts weights using gradients; the learning rate controls the update size.</text>
</svg>
