<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Train, validation, and test data</title>
  <desc id="description">Training data fits the model, validation data guides choices, and the untouched test set provides a final estimate. A warning highlights leakage between partitions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526477"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
      .title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}
      .head{font-size:23px;font-weight:700}.body{font-size:18px}.small{font-size:16px}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f3f7fb"/>
  <text x="64" y="76" class="title">Keep each split in its lane</text>
  <text x="64" y="111" class="sub">Partition first. Fit transformations only on training data.</text>
  <rect x="64" y="166" width="1072" height="100" rx="20" fill="#e2eaf2"/>
  <text x="90" y="208" class="head">Available examples</text>
  <text x="90" y="239" class="body">Rows are separated before model selection begins</text>
  <path d="M600 266V315M600 315H230V352M600 315V352M600 315H970V352" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="64" y="365" width="320" height="176" rx="20" fill="#d9f3e7" stroke="#23835b" stroke-width="3"/>
  <rect x="440" y="365" width="320" height="176" rx="20" fill="#fff0c7" stroke="#bb8212" stroke-width="3"/>
  <rect x="816" y="365" width="320" height="176" rx="20" fill="#dce8ff" stroke="#4168b3" stroke-width="3"/>
  <text x="92" y="412" class="head">TRAIN</text><text x="92" y="449" class="body">Fit preprocessing</text><text x="92" y="478" class="body">and model weights</text><text x="92" y="516" class="small">Learns from these rows</text>
  <text x="468" y="412" class="head">VALIDATION</text><text x="468" y="449" class="body">Compare models</text><text x="468" y="478" class="body">and tune choices</text><text x="468" y="516" class="small">May influence selection</text>
  <text x="844" y="412" class="head">TEST</text><text x="844" y="449" class="body">Final evaluation</text><text x="844" y="478" class="body">after choices are fixed</text><text x="844" y="516" class="small">Keep untouched until then</text>
  <rect x="64" y="580" width="1072" height="72" rx="16" fill="#ffe2df"/>
  <circle cx="101" cy="616" r="18" fill="#c74438"/><text x="95" y="623" font-size="22" font-weight="700" fill="#fff">!</text>
  <text x="136" y="612" class="head" fill="#8f2d27">Leakage warning</text>
  <text x="136" y="638" class="small">Never fit scalers, imputers, or feature selection using validation or test rows.</text>
</svg>
