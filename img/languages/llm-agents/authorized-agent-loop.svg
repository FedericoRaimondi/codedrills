<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">A bounded, authorized agent loop</title>
  <desc id="description">The model proposes a tool call. Application code validates and authorizes it before execution. Typed results return to the model, and a budget or stop condition ends the loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526477"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:20px;font-weight:700}.body{font-size:17px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f5f8fa"/>
  <text x="64" y="76" class="title">The model proposes; the application authorizes</text>
  <text x="64" y="111" class="sub">Keep tools narrow, validate arguments, and bound every loop.</text>
  <rect x="66" y="226" width="210" height="120" rx="20" fill="#e6e1fa" stroke="#7161a8" stroke-width="2"/>
  <text x="112" y="270" class="head">MODEL</text><text x="95" y="303" class="body">propose tool + args</text>
  <rect x="350" y="226" width="250" height="120" rx="20" fill="#fff0c7" stroke="#bb8212" stroke-width="3"/>
  <text x="388" y="270" class="head">APPLICATION</text><text x="377" y="303" class="body">validate + authorize</text>
  <rect x="674" y="226" width="204" height="120" rx="20" fill="#d9f3e7" stroke="#23835b" stroke-width="2"/>
  <text x="726" y="270" class="head">TOOL</text><text x="703" y="303" class="body">bounded action</text>
  <rect x="952" y="226" width="190" height="120" rx="20" fill="#dcedf6" stroke="#246d91" stroke-width="2"/>
  <text x="985" y="270" class="head">RESULT</text><text x="978" y="303" class="body">typed + checked</text>
  <path d="M276 286H342M600 286H666M878 286H944" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1046 346V430H172V354" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="534" y="419" class="body">observation returns for the next step</text>
  <rect x="350" y="480" width="530" height="84" rx="18" fill="#edf1f6"/>
  <text x="389" y="515" class="head">Budget + stop condition</text><text x="389" y="544" class="body">max steps · deadline · cost limit · explicit completion</text>
  <path d="M615 480V358" fill="none" stroke="#c35a43" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <rect x="66" y="594" width="1076" height="54" rx="14" fill="#fce2df"/>
  <text x="91" y="629" class="body" fill="#8f2d27">Never let model-generated text grant permissions or bypass confirmation for consequential actions.</text>
</svg>
