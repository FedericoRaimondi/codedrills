<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Retrieval-augmented generation pipeline</title>
  <desc id="description">A query is embedded, authorized documents are searched and ranked, selected chunks are added to context, and a model generates an answer with citations that must be checked against evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526477"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#526477}.head{font-size:18px;font-weight:700}.body{font-size:16px}</style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#f7f6fb"/>
  <text x="64" y="76" class="title">RAG: retrieve evidence, then generate</text>
  <text x="64" y="111" class="sub">Access filtering happens before results reach the model.</text>
  <g>
    <rect x="58" y="206" width="170" height="126" rx="18" fill="#e5e0f6"/><text x="91" y="249" class="head">USER QUERY</text><text x="87" y="281" class="body">question + scope</text>
    <rect x="270" y="206" width="170" height="126" rx="18" fill="#dcedf6"/><text x="301" y="249" class="head">EMBED + SEARCH</text><text x="305" y="281" class="body">query representation</text>
    <rect x="482" y="206" width="190" height="126" rx="18" fill="#fff0c7"/><text x="507" y="249" class="head">FILTER ACCESS</text><text x="505" y="281" class="body">tenant + permissions</text>
    <rect x="714" y="206" width="180" height="126" rx="18" fill="#d9f3e7"/><text x="752" y="249" class="head">RANK CHUNKS</text><text x="743" y="281" class="body">relevance + reranking</text>
    <rect x="936" y="206" width="204" height="126" rx="18" fill="#e5e0f6"/><text x="967" y="249" class="head">BUILD CONTEXT</text><text x="966" y="281" class="body">selected passages</text>
    <path d="M228 269H262M440 269H474M672 269H706M894 269H928" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <path d="M1038 332V410H850" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="636" y="423" width="218" height="104" rx="18" fill="#dce8ff" stroke="#4168b3" stroke-width="2"/>
  <text x="685" y="466" class="head">GENERATE</text><text x="668" y="496" class="body">answer + citations</text>
  <path d="M636 475H540" fill="none" stroke="#526477" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="294" y="423" width="236" height="104" rx="18" fill="#fce2df" stroke="#c35a43" stroke-width="2"/>
  <text x="330" y="466" class="head">VERIFY CLAIMS</text><text x="324" y="496" class="body">citations entail answer</text>
  <rect x="58" y="575" width="1082" height="72" rx="16" fill="#edf1f6"/>
  <text x="88" y="606" class="head">Two different checks</text><text x="88" y="632" class="body">Did retrieval find the evidence? Did generation use it accurately? Similarity alone proves neither.</text>
</svg>
